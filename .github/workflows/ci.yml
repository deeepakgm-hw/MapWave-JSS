name: CI Workflow

on:
  push:
    branches: [main, scaffold/python-stack]
  pull_request:
    branches: [main]

jobs:
  lint-api:
    name: Lint API (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check on API
        run: ruff check apps/api

  lint-web:
    name: Lint Web (ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Web dependencies
        run: npm install

      - name: Run Web Linting
        run: npm run lint
